# ProFTPD with mod_tls as at All-inkl (ProFTPD 1.3.8 there, visible in FEAT): TLS required, MLSD,
# TLS 1.3 on the data channel too, without requiring session reuse (FileHub shows TLSv1.3 there).
# Debian builds transfer, listing and TLS as loadable modules.
ModulePath /usr/lib/proftpd
LoadModule mod_xfer.c
LoadModule mod_ls.c
LoadModule mod_tls.c

ServerName "FileHub ProFTPD"
ServerType standalone
DefaultServer on
Port 2124
UseIPv6 off
UseReverseDNS off
User nobody
Group nogroup
DefaultRoot ~
RequireValidShell off
AuthOrder mod_auth_unix.c
PassivePorts 30010 30019
MasqueradeAddress 127.0.0.1
ScoreboardFile /run/proftpd.scoreboard
PidFile /run/proftpd.pid
WtmpLog off
Umask 022
AllowOverwrite on
SystemLog /var/log/proftpd.log
TransferLog /var/log/proftpd-xfer.log

<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/filehub/server.pem
  TLSRSACertificateKeyFile /etc/ssl/filehub/server.key
  TLSVerifyClient off
  TLSOptions NoSessionReuseRequired
  TLSSessionTickets on
  TLSLog /var/log/proftpd-tls.log
</IfModule>
