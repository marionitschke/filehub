listen=YES
listen_port=2121
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=127.0.0.1
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=YES
rsa_cert_file=/etc/ssl/filehub/server.pem
rsa_private_key_file=/etc/ssl/filehub/server.key
# Log every login ("OK LOGIN") so the checks can count how often FileHub logs in.
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd-tls.log
